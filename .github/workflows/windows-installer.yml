name: Windows installer

# Builds Kingdom-Hall-Attendance-Setup-<version>.exe on a Windows runner.
#  - Run by hand (Actions → Windows installer → Run workflow), or push to update-G: the installer is attached to the run.
#  - Push a tag such as v0.4.0: the installer is also uploaded to a DRAFT GitHub release, which the owner reviews and publishes.
#    Installed apps update from published releases only.
# Needs two repository secrets (Settings → Secrets and variables → Actions): KA_GOOGLE_CLIENT_ID and KA_GOOGLE_CLIENT_SECRET.
on:
  workflow_dispatch:
  push:
    branches: [update-G]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Add the Google sign-in client (kept out of git)
        shell: bash
        env:
          KA_GOOGLE_CLIENT_ID: ${{ secrets.KA_GOOGLE_CLIENT_ID }}
          KA_GOOGLE_CLIENT_SECRET: ${{ secrets.KA_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$KA_GOOGLE_CLIENT_ID" ] || [ -z "$KA_GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::KA_GOOGLE_CLIENT_ID / KA_GOOGLE_CLIENT_SECRET are not set. This installer will have Connect Google disabled."
          else
            node -e "require('fs').writeFileSync('src/core/google/config.local.js', 'module.exports = ' + JSON.stringify({ clientId: process.env.KA_GOOGLE_CLIENT_ID, clientSecret: process.env.KA_GOOGLE_CLIENT_SECRET }) + ';\n')"
          fi
      - name: Build the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never
      - name: Build the installer and upload it to a draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Put the changelog in the release notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the newest section of CHANGELOG.md, without its heading
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > release-notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\") | .id" | head -n 1)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@release-notes.md -f name="Kingdom Hall Attendance ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Hall-Attendance-Setup
          path: release/*.exe
          if-no-files-found: error
