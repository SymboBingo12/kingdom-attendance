name: Windows installer

# Builds Kingdom-Attendance-Setup-<version>.exe on a Windows runner and attaches it to the run as an artifact.
# Run it by hand (Actions → Windows installer → Run workflow) or by pushing to update-G.
on:
  workflow_dispatch:
  push:
    branches: [update-G]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Attendance-Setup
          path: release/*.exe
          if-no-files-found: error
