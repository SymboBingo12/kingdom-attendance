<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a6da7">
<title>Count · Kingdom Attendance</title>
<link rel="stylesheet" href="/steward/fonts.css">
<link rel="stylesheet" href="/steward/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--text); font-family: var(--font); font-size: var(--text-md);
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .app { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(14px, env(safe-area-inset-left, 0px));
    gap: 12px; max-width: 560px; margin: 0 auto; }

  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 12px; }
  .k { font-size: var(--text-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--brand); font-weight: var(--weight-bold); }
  .hall { font-size: 56px; font-weight: var(--weight-bold); line-height: 1; font-variant-numeric: tabular-nums; }
  .meta { color: var(--text-dim); font-size: var(--text-sm); grid-column: 1 / -1; }
  .pill { align-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill);
    font-size: var(--text-xs); font-weight: var(--weight-bold); border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .pill[data-s="live"]::before { background: var(--ok); }

  .lanes { display: grid; grid-template-rows: repeat(3, minmax(112px, 1fr)); gap: 10px; }
  .lane { display: grid; grid-template-columns: 64px 1fr minmax(44%, 1fr); align-items: stretch; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px; }
  .lane .info { display: grid; align-content: center; justify-items: center; text-align: center; }
  .lane .name { font-size: var(--text-sm); color: var(--text-dim); font-weight: var(--weight-medium); }
  .lane .n { font-size: 40px; font-weight: var(--weight-bold); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .minus, .plus { border-radius: var(--radius-sm); display: grid; place-items: center; font-weight: var(--weight-bold); transition: transform 120ms ease-out, background-color 120ms ease-out; }
  .minus { min-height: 48px; border: 1px solid var(--line); background: var(--page); color: var(--brand-strong); font-size: 28px; }
  .plus { min-height: 96px; background: var(--brand); color: var(--on-brand); font-size: 48px; }
  .minus:active, .plus:active { transform: scale(.96); }
  .plus.hit { background: var(--brand-strong); }
  .lanes[aria-disabled="true"] .lane { opacity: .45; }
  .lanes[aria-disabled="true"] button { pointer-events: none; }

  .note { min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm);
    font-size: var(--text-sm); border: 1px solid var(--line); background: var(--surface); color: var(--text-dim); }
  .note.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); color: var(--text); }
  .note.bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--text); }

  [hidden] { display: none !important; }
  .pin { position: fixed; inset: 0; background: var(--page); display: grid; place-items: center; padding: 24px; }
  .pin form { width: min(340px, 100%); display: grid; gap: 14px; text-align: center; }
  .pin h1 { margin: 0; font-size: var(--text-xl); }
  .pin p { margin: 0; color: var(--text-dim); font-size: var(--text-sm); }
  .pin input { font: inherit; font-size: 32px; letter-spacing: .4em; text-align: center; padding: 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface); color: var(--text); -webkit-user-select: text; user-select: text; }
  .pin .go { min-height: var(--tap-main); border-radius: var(--radius-sm); background: var(--brand); color: var(--on-brand); font-weight: var(--weight-bold); font-size: var(--text-lg); }
  .pin .err { color: var(--danger-text); min-height: 1.4em; }

  @media (prefers-reduced-motion: reduce) { .minus, .plus { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="k">Kingdom Hall</div>
      <div class="hall" id="hall" aria-live="polite">0</div>
    </div>
    <span class="pill" id="pill" data-s="connecting">Connecting…</span>
    <div class="meta" id="meta">&nbsp;</div>
  </header>

  <main class="lanes" id="lanes" aria-disabled="true">
    <section class="lane" data-lane="left">
      <button class="minus" data-d="-1" aria-label="One less in Left">−</button>
      <div class="info"><span class="name">Left</span><span class="n" data-n>0</span></div>
      <button class="plus" data-d="1" aria-label="One more in Left">+</button>
    </section>
    <section class="lane" data-lane="center">
      <button class="minus" data-d="-1" aria-label="One less in Center">−</button>
      <div class="info"><span class="name">Center</span><span class="n" data-n>0</span></div>
      <button class="plus" data-d="1" aria-label="One more in Center">+</button>
    </section>
    <section class="lane" data-lane="right">
      <button class="minus" data-d="-1" aria-label="One less in Right">−</button>
      <div class="info"><span class="name">Right</span><span class="n" data-n>0</span></div>
      <button class="plus" data-d="1" aria-label="One more in Right">+</button>
    </section>
  </main>

  <div class="note" id="note" role="status">Tap + for each person you see in a column.</div>
</div>

<div class="pin" id="pinScreen" hidden>
  <form id="pinForm" autocomplete="off">
    <h1>Enter the PIN</h1>
    <p>It's shown on the AV computer, next to the QR code.</p>
    <input id="pinInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" aria-label="PIN" required>
    <div class="err" id="pinErr" role="alert"></div>
    <button class="go" type="submit">Start counting</button>
  </form>
</div>

<script src="/shared/api.js"></script>
<script src="/count.js"></script>
</body>
</html>
